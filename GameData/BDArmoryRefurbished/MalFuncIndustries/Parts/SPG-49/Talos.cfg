PART
{
	// --- general parameters ---
	name = Talosradar
	module = Part
	author = Spartwo

	// --- asset parameters ---
	mesh = Talos.mu
	rescaleFactor = 1

	// --- node definitions ---
	node_attach = 0.0, 0, 0, 0, -1, 0, 0
	node_stack_bottom = 0.0, 0.0, 0.0, 0, -1, 0, 3


	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 3750
	cost = 1250
	category = none
	subcategory = 0
	bdacategory = Radars
	title = #LOC_MalFunc_Talos_title
	manufacturer = #LOC_MalFunc_agent_title
	description = #LOC_MalFunc_Talos_description
	
	attachRules = 1,1,1,0,1 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	bulkheadProfiles = srf

	// --- standard part parameters ---
	mass = 0.25
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 3600


	MODULE
	{
		name = ModuleRadar
		radarName = #LOC_MalFunc_Talos_radar
		
		showDirectionWhileScan = false
		directionalFieldOfView = 30
		canLock = true
		multiLockFOV = 30	
		maxLocks = 2
		omnidirectional = true
		rwrThreatType = 0
		canScan = false
        scanRotationSpeed = 0.00001
		canRecieveRadarData = true
		canTrackWhileScan = true
        radarName = STIR Fire Control Radar
        radarGroundClutterFactor = 0.6
		
        radarDetectionCurve
        {        //        key = distance	rcs
                  key = 0.0	0
                  key = 5	0.5// very good performance at close range
                  key = 15 1   //
                  key = 20 5	//good performance at medium range
                  key = 50 10  //still good performance at longer range
        }
        radarLockTrackCurve
        {          //      key = distance	rcs
                  key = 0.0	0
                  key = 10	0.5 //very good performance at close range
                  key = 15 1   //
                  key = 20 5	//good performance at medium range
                  key = 50 10  //still good performance at longer range
        }
	}
	MODULE
	{
		name = ModuleTurret
		
		pitchTransformName = pitchTransform
		yawTransformName = yawTransform	
		pitchSpeedDPS = 120
		yawSpeedDPS = 120	
		maxPitch = 85
		minPitch = -8	
		yawRange = 360	
		smoothRotation = true
		smoothMultiplier = 5
	}
}
