		minAudioPitch = 0.15
		maxVolume = 0.60
	}
	
	MODULE
	{
		name = ModuleWeapon
		shortName = #LOC_PEW_Challenger_weapon
		
		fireTransformName = fireTransform
		hasDeployAnim = false
		hasFireAnimation = true
		fireAnimName = ChallengerFire
		spinDownAnimation = false
