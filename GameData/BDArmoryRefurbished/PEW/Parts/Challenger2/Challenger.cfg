		explModelPath = BDArmory/Models/explosion/explosionLarge 
	}
	
	RESOURCE
	{
		name = CannonShells
		amount = 40
		maxAmount = 40
	}
	
	MODULE
	{
		name = HitpointTracker
		ArmorThickness = 180
		maxHitPoints = 12000 // chally armor! 
