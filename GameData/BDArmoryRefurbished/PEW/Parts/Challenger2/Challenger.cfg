	mass = 2.4
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 125
	maxTemp = 3600
	
	stagingIcon = SOLID_BOOSTER


	MODULE
	{
		name = ModuleTurret
		pitchTransformName = Pitch
		yawTransformName = Yaw
		pitchSpeedDPS = 60
