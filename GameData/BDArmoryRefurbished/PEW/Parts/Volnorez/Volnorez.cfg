PART
{
	// --- general parameters ---
	name = PEW-Volnorez
	module = Part
	author = Spartwo

	// --- asset parameters ---
	mesh = Volnorez.mu
	rescaleFactor = 1

	// --- node definitions ---
	node_attach = 0.0, -0.01, 0, 0, -1, 0, 0
	node_stack_bottom = 0.0, -0.01, 0, 0, -1, 0, 0

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 3500
	cost = 1800
	category = none
	bdacategory = Countermeasures
	subcategory = 0

	attachRules = 1,1,1,1,0 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	bulkheadProfiles = size0, srf
	
	title = #loc_BDArmory_part_bahaECMJammer_title  //AN/ALQ-131 ECM Jammer
	manufacturer = #loc_BDArmory_agent_title  //Bahamuto Dynamics
	description = #loc_BDArmory_part_bahaECMJammer_description  
	tags = #loc_BDArmory_part_bahaECMJammer_tags
	
	// --- standard part parameters ---
	mass = 0.3
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 3600


	MODULE
	{
		name = ModuleECMJammer

		// Jammer capabilities:
		alwaysOn = false		// can be enabled/disabled, or is always on
						// Set this to true for "stealth" jammers that are integrated into Cockpits and serve
						// to reduce only the radar cross section, but without providing another jamming effect!

		resourceDrain = 3		// resource/sec. Set this higher for more capabale jammers.
		resourceName = ElectricCharge	// Resource used by the jammer. ElectricCharge by default
		jammerStrength = 300		// this is a factor (in relation to a vessels base radar cross section) how much the crafts DETECTABILITY is INCREASED(!) when the jammer is active

		lockBreaker = true		// true: jammer serves to break radar locks (default: true)
		lockBreakerStrength = 125	// factor (in relation to a vessels base radar cross section) how strong the lockbreaking effect is

		rcsReduction = false		// jammer reduces a crafts radar cross section, simulating 2nd generation stealth (radar obsorbent coating)
		rcsReductionFactor = 0		// factor for radar cross section: from 0 (craft is invisible) to 1 (no effect) Greater than 1 will confer a RCS malus (craft extra visible)
		cooldownInterval = -1		// if > 0, cooldown time before the device can be triggered again
	}

	MODULE
	{
		name = HitpointTracker
		ArmorThickness = 40
		maxHitPoints = 120
	}
}
