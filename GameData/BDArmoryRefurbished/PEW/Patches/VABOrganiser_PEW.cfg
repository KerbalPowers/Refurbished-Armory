/// Subcategory assignments for PEW parts


@PART[T90MS,Challenger299Turret]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = tankGun
  }
}

@PART[PEW-Bradley,Eland90BTurret,PEW-Bradley-TOW,PEW-BMP2]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = ifv
  }
}

@PART[PEW-mk19]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = RWS
  }
}