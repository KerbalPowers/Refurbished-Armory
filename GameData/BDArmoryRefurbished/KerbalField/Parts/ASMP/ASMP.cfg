PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = kfer_ASMPA-R
module = Part
author = BahamutoD, Cypher

// --- asset parameters ---
mesh = ASMP.mu
rescaleFactor = 1


// --- node definitions ---
	NODE {
		name = top
		transform = node0
		size = 0
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 10000
cost = 5000
category = none
bdacategory = Missiles
subcategory = 0
bulkheadProfiles = srf
title = #autoLOC_ASMP_title
manufacturer = #autoLOC_kbfer_chunk
description = #autoLOC_ASMP_description
tags = CCK-KBF

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 0.86
dragModelType = default
maximum_drag = 0.01
minimum_drag = 0.01
angularDrag = 2
crashTolerance = 20
maxTemp = 3600


MODULE
{
  name = MissileLauncher
  shortName = ASMPA-R

  thrust = 200 //KN thrust during boost phase
  cruiseThrust = 110 //thrust during cruise phase
  dropTime = 1 //how many seconds after release until engine ignites
  boostTime = 6 //seconds of boost phase
  cruiseTime = 300 //seconds of cruise phase
  cruiseDelay = 0
  guidanceActive = true //missile has guidanceActive
  maxTurnRateDPS = 28 //degrees per second

  CruiseSpeed = 1000
  CruisePredictionTime = 30
  CruiseAltitude = 18000
  DetonationDistance = 500

  decoupleSpeed = 2
  decoupleForward = false

  audioClipPath = BDArmory/Sounds/jet
  boostClipPath = BDArmory/Sounds/jet
	exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
	boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
	boostExhaustTransformName = boostTransform
	boostTransformName = boostTransform


  optimumAirspeed = 310

  homingType = Cruise
  targetingType = gps
  terminalGuidanceShouldActivate = false

  maxOffBoresight = 90
  lockedSensorFOV = 10
  agmDescentRatio = 1.2

  rotationTransformName = rotationTransform

  maxAoA = 45

  deployAnimationName = AGM158deploy
  deployedDrag = 0.002
  deployTime = 0.35

  aero = true
  liftArea = 0.1
  steerMult = 8
  maxTorque = 70
  torqueRampUp = 50
  aeroSteerDamping = 5

  exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
  minLaunchSpeed = 100
  minStaticLaunchRange = 700
  maxStaticLaunchRange = 300000

	engageAir = false
	engageMissile = false
	engageGround = true
	engageSLW = false
}
MODULE
	{
		name = BDModuleNuke
		thermalRadius = 13000 //clamps AoE to a max of this distance
		yield = 300 // yield, in kilotons
		fluence = 1.0 //thermal bloom modifier, reduce for less toasty nukes
		isEMP = false // does this generate an EMP
		reportingName = ASMPA-R KBF-ER //weapon name that appears in competition log
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash //initial flash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock //shockwave
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast //fireball
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume //mushroom cloud stalk
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter //ground scatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom //sound
	}
MODULE
	{
		name = ModulePartVariants
		baseVariant = Standard
		useMultipleDragCubes = false
		VARIANT
		{
			name = Standard
			displayName = Standard
			themeName = Standard
			primaryColor = #ffffff
			secondaryColor = #000000
			TEXTURE
			{
				mainTextureURL = KerbalField/Parts/EU/ASMP/ASMP
			}		
		}
	}
}
