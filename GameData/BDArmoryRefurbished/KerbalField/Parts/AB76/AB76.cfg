@PART[AB76]:FOR[BDArmory]:NEEDS[KerbalField]
{
	%author = Spartwo
	
	// --- asset parameters ---
	MODEL
	{
		%model = BDArmoryRefurbished/KerbalField/Parts/AB76/AB76
		%scale = 1, 1, 1
	}
	%rescaleFactor = 1

	// --- node definitions ---
	%node_attach = 0.0, 0, 0, 0, -1, 0, 0

	// --- editor parameters ---
	%TechRequired = precisionEngineering
	%entryCost = 11250
	%cost = 3750
	%category = none
	%bdacategory = Guns
	%subcategory = 0
	
	%attachRules = 0,1,0,1,1 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	%bulkheadProfiles = srf
	
	%title = #LOC_KerbalField_AB76_title
	%manufacturer = #LOC_KPDynamics_Gladia_title
	%description = #LOC_KerbalField_AB76_description
	%tags = #loc_BDArmory_part_bahaM102Howitzer_tags 

	// --- standard part parameters ---
	%mass = 1.5
	%crashTolerance = 60


	@MODULE[ModuleWeapon],0
	{
		name = ModuleWeapon
		%shortName = #LOC_KerbalField_AB76_weapon
		
		%fireTransformName = FireTransform
		
		%hasDeployAnim = false
		
		%hasFireAnimation = true
		%fireAnimName = AB76Fire
		%spinDownAnimation = false
		%muzzleTransformName = muzzleTransformFlash
		
		%roundsPerMinute = 100
		%maxDeviation = 0.062
		%maxTargetingRange = 13000
		%maxEffectiveDistance = 12000
		
		%BeltFed = false
		%RoundsPerMag = 5
		%ReloadTime = 2
		
		%ammoName = 76x636Ammo
		%bulletType = 76x636mmGPShell; 76x636mmPLA-PShell; 76x636mmPFShell
		%requestResourceAmount = 1
		%canHotSwap = true
		
		%shellScale = 2.66
		%shellEjectVelocity = -4.0, 0.0, -2.0
		%shellEjectDeviation = 0.2
		
		%hasRecoil = true
		%recoilReduction = 0.85
		%onlyFireInRange = true
		%bulletDrop = true

		%weaponType = ballistic
		
		%tracerLength = 0
		%tracerDeltaFactor = 3.75
		%tracerLuminance = 2

		%maxHeat = 3600
		%heatPerShot = 60
		%heatLoss = 740

		%fireSoundPath = BDArmoryRefurbished/KerbalField/Sounds/76mmShot
		%overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat
		%oneShotSound = true
		%showReloadMeter = true
		%reloadAudioPath = BDArmory/Parts/m1Abrams/sounds/reload
	}


	!RESOURCE[CannonShells],0
	{
	}
	
	RESOURCE
	{
		name = 76x636Ammo
		amount = 25
		maxAmount = 25
	}
	MODULE
	{
		name = ModuleCASE
		CASELevel = 1
	}

}

