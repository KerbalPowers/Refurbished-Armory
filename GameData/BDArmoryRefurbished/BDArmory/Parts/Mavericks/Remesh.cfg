@PART[bahaAGM-65]:HAS[~BDRIgnore[?rue]]:FOR[BDRefurbished]
{
  	!mesh = DELETE
  	!MODEL {}
  	MODEL
  	{
    	model = BDArmoryRefurbished/BDArmory/Parts/Mavericks/AGM-65
  	}
	
	%node_attach = 0.0, 0.15, -0.5, 0, 1, 0, 0
	%node_stack_top = 0.0, 0.15, -0.1, 0, 1, 0, 0
	
	%title = #LOC_BDRefurb_Maverick_title
	%manufacturer = #loc_BDArmory_agent_title
	//%description = #LOC_BDRefurb_Maverick_description
	
	@MODULE[MissileLauncher],0
	{
		%shortName = #LOC_BDRefurb_Maverick_Weapon
		
		%exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaustPrefabII
		%boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaustPrefabII
	}	
	
	MODULE
	{
		name = ModulePartVariants
		baseVariant = Tapered
		useMultipleDragCubes = false
		VARIANT
		{
			name = Straight
			displayName = #LOC_BDRefurb_Mavericks_Variant_Straight
			themeName = GrayAndWhite		
			primaryColor = #D1D1D1
			secondaryColor = #BDBDBD
			GAMEOBJECTS
			{
				StraightStrake1 = true
				StraightStrake2 = true
				StraightStrake3 = true
				StraightStrake4 = true
				Strake1 = false
				Strake2 = false
				Strake3 = false
				Strake4 = false
				StraightFin1 = true
				StraightFin2 = true
				StraightFin3 = true
				StraightFin4 = true
				Fin1 = false
				Fin2 = false
				Fin3 = false
				Fin4 = false
			}
		}
		VARIANT
		{
			name = Tapered
			displayName = #LOC_BDRefurb_Mavericks_Variant_Tapered
			themeName = GrayAndWhite
			primaryColor = #D1D1D1
			secondaryColor = #BDBDBD
			GAMEOBJECTS
			{
				StraightStrake1 = false
				StraightStrake2 = false
				StraightStrake3 = false
				StraightStrake4 = false
				Strake1 = true
				Strake2 = true
				Strake3 = true
				Strake4 = true
				StraightFin1 = false
				StraightFin2 = false
				StraightFin3 = false
				StraightFin4 = false
				Fin1 = true
				Fin2 = true
				Fin3 = true
				Fin4 = true
			}
		}
	}	
}
	

