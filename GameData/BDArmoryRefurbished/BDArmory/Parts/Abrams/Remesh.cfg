  	{
    	model = BDArmory/Parts/m1Abrams/model
		texture = tex_abrams, BDArmoryRefurbished/BDArmory/Parts/Abrams/Abrams_Tex
  	}
	
	%title = #LOC_BDRefurb_Abrams_title //M1 Abrams Turret
