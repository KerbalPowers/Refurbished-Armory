@PART[bahaAim120]:HAS[~BDRIgnore[?rue]]:FOR[BDRefurbished]
{
  	!mesh = DELETE
  	!MODEL {}
  	MODEL
  	{
    	model = BDArmoryRefurbished/BDArmory/Parts/AIM-120/AMRAAM
		texture = AMRAAM_Tex, BDArmoryRefurbished/BDArmory/Parts/AIM-120/AMRAAM_Tex
  	}
	
	%node_attach = 0.0, 0.09, -0.175, 0, 1, 0, 0
	%node_stack_top = 0.0, 0.09, -0.175, 0, 1, 0, 0
	
	MODULE
	{
		name = ModulePartVariants
		baseVariant = Uncut
		useMultipleDragCubes = false
		VARIANT
		{
			name = Uncut
			displayName = #LOC_BDRefurb_AMRAAM_Variant_Uncut
			themeName = GrayAndWhite
			primaryColor = #D1D1D1
			secondaryColor = #BDBDBD
			GAMEOBJECTS
			{
				CutFins = false
				Fins = true
			}
		}
		VARIANT
		{
			name = Cut
			displayName = #LOC_BDRefurb_AMRAAM_Variant_Cut
			themeName = GrayAndWhite
			primaryColor = #D1D1D1
			secondaryColor = #BDBDBD
			GAMEOBJECTS
			{
				CutFins = true
				Fins = false
			}
		}
	}	
	
	
	@MODULE[MissileLauncher],0
	{
		%exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaustPrefabII
		%boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaustPrefabII
	}	
}
	

