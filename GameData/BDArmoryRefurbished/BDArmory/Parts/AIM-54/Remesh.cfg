@PART[bahaERRAAM]:HAS[~BDRIgnore[?rue]]:NEEDS[BDArmoryExtended]:FOR[BDRefurbished]
{
	%author = SuicidalInsanity / Spartwo
  	!mesh = DELETE
  	!MODEL {}
  	MODEL
  	{
		model = BDArmoryRefurbished/BDArmory/Parts/AIM-54/Phoenix
  	}
	
	%node_attach = 0.0, 0.16, 0, 0, 1, 0, 0
	%node_stack_top = 0.0, 0.16, 0, 0, 1, 0, 0
	
	%title = #LOC_BDRefurb_ERRAAM_title //AIM-54 Phoenix Missile
	%manufacturer = #loc_BDArmory_agent_title
	%description = #LOC_BDRefurb_ERRAAM_description
	
	MODULE
	{
		name = ModulePartVariants
		baseVariant = Live
		useMultipleDragCubes = false
		VARIANT
		{
			name = Live
			displayName = #LOC_Refurb_Variant_Live
			themeName = GrayAndWhite
			primaryColor = #65552F
			secondaryColor = #BB8600
			TEXTURE
			{
				mainTextureURL = BDArmoryRefurbished/BDArmory/Parts/AIM-54/Phoenix_Tex
			}
		}
		VARIANT
		{
			name = Inert
			displayName = #LOC_Refurb_Variant_Inert
			themeName = GrayAndWhite
			primaryColor = #556CBA
			secondaryColor = #BDBDBD
			TEXTURE
			{
				mainTextureURL = BDArmoryRefurbished/BDArmory/Parts/AIM-54/Phoenix_Tex_Inert
			}
		}
	}	
	
	@MODULE[MissileLauncher],0
	{
		%boostExhaustTransformName = boostTransform
		%exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaustPrefabII
		%boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaustPrefabII
	}	
}