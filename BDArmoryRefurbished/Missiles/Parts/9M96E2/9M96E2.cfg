PART
{
	// --- general parameters ---
	name = PEW9M96E2
	module = Part
	author = LORDPrometheus / Spartwo

	// --- asset parameters ---
	mesh = 9M96E2.mu
	rescaleFactor = 1

	// --- node definitions ---
	node_attach = 0.0, 0.094, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.094, 0, 0, 1, 0, 0

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 10500
	cost = 3800
	category = none
	bdacategory = Missiles
	subcategory = 0

	attachRules = 1,1,0,0,1 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	bulkheadProfiles = srf
	
	title = #LOC_PEW_9M96E2_title
	manufacturer = #LOC_PEW_Agent_title
	description = #LOC_PEW_9M96E2_description
	tags = #loc_BDArmory_part_bahaPac-3_tags 

	// --- standard part parameters ---
	mass = 0.420
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600


	MODULE
	{
		name = MissileLauncher

		shortName = #LOC_PEW_9M96E2_weapon

		thrust = 82 //KN thrust during boost phase
		cruiseThrust = 60 //thrust during cruise phase
		dropTime = 0 //how many seconds after release until engine ignites
		boostTime = 6.5 //seconds of boost phase
		cruiseTime = 304 //seconds of cruise phase
		guidanceActive = true //missile has guidanceActive

		decoupleSpeed = 5
		decoupleForward = true
		
		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaustPrefabII
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaustPrefabII
		boostTransformName = boostTransform
		boostExhaustTransformName = boostTransform

		optimumAirspeed = 1400

		aero = true
		liftArea = 0.06
		dragArea = 0.005
		steerMult = 10
		maxTorque = 120
		torqueRampUp= 180
		gLimit = 90
		maxAOA = 35

		missileType = missile
		homingType = aam

		terminalHoming = true
	    terminalHomingType = ProNav //switches to ProNav at final engagement for a more accurate homing solution at expense of energy expenditure
	    pronavGain = 6 // ProNav gain constant, only used with ProNav and AugProNav homing types (default is 3)
	    terminalHomingRange = 10000

		targetingType = radar
		activeRadarRange = 6000
		maxOffBoresight = 55
		lockedSensorFOV = 7.5

		minStaticLaunchRange = 2000
		maxStaticLaunchRange = 375000
	}
	
	MODULE {
		name = BDExplosivePart
		tntMass = 30
		warheadType = ContinuousRod
		fuseFailureRate = 0	// How often the explosive fuse will fail to detonate (0-1), evaluated once on detonation trigger
	}

}
